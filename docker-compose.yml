services:

  frontend:
    # user: "${HOST_UID}:${HOST_GID}"
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: c3-front
    ports:
      - "3000:3000"
      - 9229:9229
      - 9230:9230
    volumes:
      - ./frontend:/var/app
      - /var/app/node_modules
      - ./frontend/.next:/var/app/.next
    depends_on:
      - backend

  backend:
    user: "${HOST_UID}:${HOST_GID}"
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: c3-web
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/app
    depends_on:
      - mysql
  mysql:
    image: mysql:8.4
    container_name: c3-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=password
      - TZ=Asia/Tokyo
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

volumes:
  mysql_data: